name: esp32-iot

services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883" # MQTT port
      - "9001:9001" # WebSocket port
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - iot-network
    restart: unless-stopped
    # Enabling host.docker.internal so containers can talk to your host machine apps (if needed)
    extra_hosts:
      - "host.docker.internal:host-gateway"

  node-red:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: node-red
    environment:
      - TZ=America/Sao_Paulo
    ports:
      - "1880:1880" # Node-RED UI mapped to 1881 on your computer
    volumes:
      # This matches the persistent volume named below
      - node-red-data:/data
    depends_on:
      - mosquitto
    networks:
      - iot-network
    restart: unless-stopped

  mqtt-explorer:
    image: ruseler/mqtt-explorer:local
    container_name: mqtt-explorer
    restart: unless-stopped
    ports:
      - "1881:3000"
    environment:
      MQTT_EXPLORER_SKIP_AUTH: "true"
    networks:
      - iot-network
    volumes:
      - ./mqtt-explorer/data:/app/data
    depends_on:
      - mosquitto
volumes:
  node-red-data:

networks:
  iot-network:
    driver: bridge
