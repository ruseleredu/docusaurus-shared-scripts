name: "Erro de correção / nota"
description: "A correção automática deu nota errada, falhou, ou o boletim está inconsistente."
title: "[Correção] "
labels: ["correção", "bug"]
body:
  - type: markdown
    attributes:
      value: |
        Obrigado por reportar! Preencha os campos para acelerar a análise.
        Tenha em mãos o link do run em **Actions** e o **GRADE.md** do seu último push.
  - type: input
    id: lab
    attributes:
      label: "Aula / lab"
      description: "O prefixo do repositório."
      placeholder: "lab00"
    validations:
      required: true
  - type: input
    id: grupo
    attributes:
      label: "Repositório do grupo"
      description: "owner/nome ou apenas o grupo."
      placeholder: "ELT85B-N21-2026-2/lab00-grupo-a"
    validations:
      required: true
  - type: input
    id: tarefa
    attributes:
      label: "Tarefa afetada (token)"
      description: "O código do ponto de commit."
      placeholder: "T3"
    validations:
      required: false
  - type: dropdown
    id: tipo
    attributes:
      label: "Tipo do problema"
      options:
        - "Fiz a tarefa e NÃO pontuou (falso negativo)"
        - "Pontuou SEM eu ter feito (falso positivo)"
        - "Nota final incorreta / soma errada"
        - "Workflow falhou (erro de execução)"
        - "Boletim (GRADE.md) inconsistente"
        - "Outro"
    validations:
      required: true
  - type: textarea
    id: observado
    attributes:
      label: "O que aconteceu"
      description: "Descreva o comportamento observado."
    validations:
      required: true
  - type: textarea
    id: esperado
    attributes:
      label: "O que você esperava"
    validations:
      required: true
  - type: input
    id: run
    attributes:
      label: "Link do run (Actions)"
      placeholder: "https://github.com/.../actions/runs/123456789"
  - type: input
    id: commit
    attributes:
      label: "Commit relevante (SHA ou mensagem)"
      placeholder: "T3: implementa ..."
  - type: textarea
    id: boletim
    attributes:
      label: "Trecho do boletim / logs"
      description: "Cole o pedaço relevante do GRADE.md ou do log do job."
      render: text
  - type: checkboxes
    id: confirmacoes
    attributes:
      label: "Confirmações"
      options:
        - label: "A mensagem do meu commit começa com o token da tarefa (ex.: `T3:`)"
        - label: "Fiz `git push` após o commit"
        - label: "Li a página \"Como funciona a avaliação\""
