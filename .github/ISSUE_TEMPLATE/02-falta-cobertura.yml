name: "Falta / cobertura da rubrica"
description: "Uma tarefa não é avaliada, um requisito não é checado, ou o grade.py está fora de sincronia com o MDX."
title: "[Cobertura] "
labels: ["cobertura", "falta"]
body:
  - type: markdown
    attributes:
      value: |
        Use para lacunas na avaliação: algo que deveria ser cobrado e não é,
        ou o `grade.py` divergente do MDX (ver `gen_grade.py --check`).
  - type: input
    id: lab
    attributes:
      label: "Aula / lab"
      placeholder: "lab00"
    validations:
      required: true
  - type: input
    id: tarefa
    attributes:
      label: "Tarefa / token (se aplicável)"
      placeholder: "T5"
    validations:
      required: false
  - type: dropdown
    id: tipo
    attributes:
      label: "Tipo da falta"
      options:
        - "Requisito da tarefa não é avaliado"
        - "Tarefa sem check adequado"
        - "Divergência MDX vs grade.py (gen_grade --check)"
        - "CommitPoint faltando/incorreto no MDX"
        - "Rubrica / pontos incorretos"
        - "Outro"
    validations:
      required: true
  - type: textarea
    id: descricao
    attributes:
      label: "Descrição da falta"
      description: "O que deveria ser avaliado e não é (ou está errado)?"
    validations:
      required: true
  - type: textarea
    id: sugestao
    attributes:
      label: "Sugestão de check / critério"
      description: "Ex.: contem procurando `switch`, compila, ou release com os assets."
    validations:
      required: false
  - type: textarea
    id: check_output
    attributes:
      label: "Saída de gen_grade.py --check (se rodou)"
      render: text
    validations:
      required: false
